<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063d2a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Refreshing demo | Barford Golf Society</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#06241a;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}
    main{width:min(100%,420px)}
    img{width:92px;height:92px;object-fit:contain;padding:4px;border-radius:50%;background:#fff}
    .logo{display:grid;place-items:center;margin-bottom:24px}
    h1{margin:0 0 12px;font-family:Georgia,serif;font-size:2rem}
    p{margin:0;color:#d8e4dd;font-size:1.05rem;line-height:1.5}
    .loader{width:44px;height:44px;margin:26px auto 0;border:4px solid rgba(255,255,255,.2);border-top-color:#e1be72;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="assets/images/barford-golf-society-logo.png" alt="Barford Golf Society"></div>
    <h1>Loading the latest demo</h1>
    <p>Removing the old saved version from this phone…</p>
    <div class="loader" aria-hidden="true"></div>
  </main>
  <script>
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      } catch (_) {}
      window.location.replace(`index.html?fresh=${Date.now()}`);
    })();
  </script>
</body>
</html>
