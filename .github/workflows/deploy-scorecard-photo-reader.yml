name: Deploy scorecard photo reader

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/scorecard-photo-reader/**"
      - ".github/workflows/deploy-scorecard-photo-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy protected scorecard reader
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy scorecard-photo-reader --project-ref xspzmthygrajzktydvvj --no-verify-jwt
