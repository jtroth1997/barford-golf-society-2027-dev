name: Configure 2027 account signup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable-email-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Disable confirmation emails for the isolated 2027 project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            'https://api.supabase.com/v1/projects/xspzmthygrajzktydvvj/config/auth' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"mailer_autoconfirm":true}'
