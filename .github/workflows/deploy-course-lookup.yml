name: Deploy admin course lookup

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/course-lookup/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-course-lookup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the 2027 website
        uses: actions/checkout@v4

      - name: Set up Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure optional Google API keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            supabase secrets set GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" --project-ref xspzmthygrajzktydvvj
          fi
          if [ -n "$YOUTUBE_API_KEY" ]; then
            supabase secrets set YOUTUBE_API_KEY="$YOUTUBE_API_KEY" --project-ref xspzmthygrajzktydvvj
          fi

      - name: Deploy protected course lookup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy course-lookup --project-ref xspzmthygrajzktydvvj

# Manual redeploy trigger: Google Places secret configured
