<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063f2d">
  <meta name="description" content="Barford Golf Society 2027 scores, handicaps and round results.">
  <title>Scores | Barford Golf Society 2027</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=fast3">
  <link rel="stylesheet" href="assets/css/scores.css?v=7">
  <link rel="stylesheet" href="assets/css/mobile-menu-fix.css?v=1">
  <link rel="stylesheet" href="assets/css/accessible-mobile.css?v=rapid2">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to scores</a>

  <header class="site-header global-site-header">
  <div class="shell header-inner">
    <a class="brand global-brand" href="index.html" aria-label="Barford Golf Society home">
      <img decoding="async" fetchpriority="high" src="assets/images/barford-golf-society-logo.png" alt="Barford Golf Society">
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="global-navigation">
      <span class="sr-only">Open menu</span><span></span><span></span><span></span>
    </button>
    <nav id="global-navigation" class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="worldevents.html">World Events</a>
      <a class="active" href="scores.html" aria-current="page">Scores</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="account.html">My Account</a>
<a class="" href="admin.html">Admin</a>
    </nav>
  </div>
</header>

  <main id="main-content">
    <section id="leaderboardView" class="view is-active leaderboard-first" aria-labelledby="leaderboardHeading">
      <div class="leaderboard-titlebar">
        <div><p class="eyebrow">Current standings</p><h2 id="leaderboardHeading">Leaderboard</h2></div>
        <span class="season-chip" id="seasonChip">2027</span>
      </div>
      <div class="leaderboard-round-tabs" id="leaderboardRoundTabs" role="tablist" aria-label="Leaderboard after round"></div>
      <div id="leaderboardList" class="leaderboard-list"></div>
      <div class="leaderboard-context" id="leaderboardContext"></div>
      <section class="search-panel compact-search" aria-label="Player search">
        <label for="playerSearch">Find a player</label>
        <div class="search-control">
          <span aria-hidden="true">⌕</span>
          <input id="playerSearch" type="search" inputmode="search" autocomplete="off" placeholder="Type a player name">
        </div>
      </section>
      <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
    </section>

    <nav class="primary-nav" id="scoresNav" aria-label="Scores navigation">
      <button class="nav-tab is-active" data-view="leaderboard" type="button">Leaderboard</button>
      <button class="nav-tab" data-view="rounds" type="button">Rounds</button>
      <button class="nav-tab" data-view="handicaps" type="button">Handicap History</button>
      <button class="nav-tab" data-view="statistics" type="button">Statistics</button>
    </nav>

    <section id="roundsView" class="view" hidden>
      <div class="section-heading">
        <div><p class="eyebrow">Round-by-round</p><h3>Round results</h3></div>
      </div>
      <div class="round-tabs" id="roundTabs" role="tablist" aria-label="Select round"></div>
      <div id="roundSummary" class="round-summary"></div>
      <div id="roundList" class="round-list"></div>
    </section>

    <section id="handicapsView" class="view" hidden>
      <div class="section-heading">
        <div><p class="eyebrow">Season movement</p><h3>Handicap history</h3></div>
      </div>
      <label class="field"><span>Player</span><select id="handicapPlayerSelect"></select></label>
      <article class="chart-card"><div id="handicapChart" class="handicap-chart" role="img" aria-label="Handicap progression chart"></div></article>
      <div id="handicapTimeline" class="timeline"></div>
    </section>

    <section id="statisticsView" class="view" hidden>
      <div class="section-heading"><div><p class="eyebrow">Player performance</p><h3>Statistics</h3></div></div>
      <div id="statisticsGrid" class="statistics-grid"></div>
    </section>
  </main>

  <dialog id="confirmDialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirmTitle">Confirm action</h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">Cancel</button>
        <button value="confirm" class="danger-button" id="confirmActionButton">Confirm</button>
      </div>
    </form>
  </dialog>

  <template id="leaderboardCardTemplate">
    <article class="player-card">
      <button class="player-card-summary" type="button" aria-expanded="false">
        <span class="rank-badge"></span>
        <span class="player-main"><strong class="player-name"></strong><span class="player-meta"></span></span>
        <span class="points-block"><strong class="player-points"></strong><span>points</span></span>
        <span class="expand-indicator" aria-hidden="true">⌄</span>
      </button>
      <div class="player-details" hidden></div>
    </article>
  </template>

  <script src="assets/js/app.js?v=rapid17" defer></script>
  <script type="module" src="assets/js/scores.js?v=7"></script>
<script src="assets/js/accessible-mobile.js?v=rapid2" defer></script>
<script data-mobile-nav-lock>
window.addEventListener("DOMContentLoaded",()=>document.querySelectorAll(".mobile-quick-nav").forEach(nav=>{const links=nav.querySelectorAll("a");const item=links[links.length-1];if(!item)return;item.href="account.html";item.innerHTML='<span class="quick-icon" aria-hidden="true">●</span><span>My Account</span>';item.classList.toggle("active",location.pathname.endsWith("/account.html"));if(location.pathname.endsWith("/account.html"))item.setAttribute("aria-current","page");else item.removeAttribute("aria-current");}));
</script>
</body>
</html>
