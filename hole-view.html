<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.gps-page{overflow:hidden;background:#111;color:#fff}#courseMap{position:fixed;inset:0;width:100vw;height:100dvh;background:#17351d}.gps-ui{position:fixed;inset:0;z-index:2;pointer-events:none}.gps-ui button{font:inherit;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}.gps-top{position:absolute;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;align-items:center}.gps-back{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:50%;background:#171917e8;color:#fff;font-size:24px;box-shadow:0 2px 9px #0006}.gps-tool{display:none}.hole-card{height:58px;display:grid;grid-template-columns:40px 1.25fr .55fr .75fr .75fr;align-items:center;flex:1;padding:4px 7px;border-radius:9px;background:#171917ee;box-shadow:0 3px 13px #0007}.hole-number{font-size:27px;line-height:1;font-weight:850;border-right:1px solid #ffffff20}.hole-number small{display:block;font-size:8px;color:#aaa;margin-top:2px}.hole-main,.hole-stat{text-align:center;min-width:0}.hole-main small,.hole-stat small{display:block;color:#b9bdb9;font-size:9px;white-space:nowrap}.hole-main strong{display:block;font-size:19px;line-height:1.1;white-space:nowrap}.hole-stat b{font-size:17px}.gps-pill{position:absolute;left:50%;transform:translateX(-50%);top:78px;border-radius:999px;background:#171917e9;padding:8px 13px;font-size:13px;font-weight:750;box-shadow:0 2px 10px #0006;white-space:nowrap}.hidden{display:none!important}.gps-bottom{position:absolute;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:56px 1fr 56px;gap:7px;align-items:end}.side-button{height:54px;border:0;border-radius:9px;background:#171917ee;color:#fff;font-weight:750;font-size:10px;box-shadow:0 3px 12px #0007}.hole-nav{display:grid;grid-template-columns:44px 1fr 44px;height:54px;border-radius:9px;background:#171917ee;overflow:
