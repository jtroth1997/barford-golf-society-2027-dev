<body class="gps-page">
<div id="courseMap"></div>
<div class="gps-ui">
 <div class="gps-top"><button class="gps-back" id="exitGps" aria-label="Exit GPS">‹</button><div class="hole-card"><div class="hole-number" id="holeNumber">1<small>Hole</small></div><div class="hole-main"><small>Mid Green</small><strong id="totalYards">— yds</strong></div><div class="hole-stat"><small>Par</small><b id="holePar">—</b></div><div class="hole-stat"><small id="teeLabel">Yellow</small><b id="teeYards">—</b></div><div class="hole-stat"><small>Handicap</small><b id="holeSI">—</b></div></div><button class="gps-tool" id="rotateLeft" aria-label="Rotate view left">↺</button><button class="gps-tool" id="rotateRight" aria-label="Rotate view right">↻</button><button class="gps-tool" id="openPicker" aria-label="Choose course">⌕</button></div>

 <div class="gps-bottom"><button id="mapHole" class="side-button">Map<br>hole</button><div class="hole-nav"><button id="previousHole" aria-label="Previous hole">‹</button><div class="current-hole">Hole <span id="bottomHole">1</span><small>GPS view</small></div><button id="nextHole" aria-label="Next hole">›</button></div><button id="threeDBtn" class="side-button">3D<br>view</button></div>
