<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPS Course View | Barford Golf Society</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.gps-page{overflow:hidden;background:#111;color:#fff}#courseMap{position:fixed;inset:0;width:100vw;height:100dvh;background:#17351d}.gps-ui{position:fixed;inset:0;z-index:2;pointer-events:none}.gps-ui button{font:inherit;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}.gps-top{position:absolute;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center}.gps-back,.gps-tool{flex:0 0 42px;width:42px;height:42px;border:0;border-radius:50%;background:#161916e8;color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 2px 10px #0005}.gps-tool{display:none}.hole-card{height:62px;display:grid;grid-template-columns:42px 1.35fr .62fr .9fr .8fr;align-items:center;flex:1;padding:5px 10px;border-radius:10px;background:#171917ee;box-shadow:0 3px 14px #0007}.hole-number{font-size:28px;line-height:1;font-weight:800;text-align:left;border-right:1px solid #ffffff22}.hole-number small{display:block;font-size:9px;margin-top:3px;color:#bbb;font-weight:500}.hole-main,.hole-stat{text-align:center;min-width:0}.hole-main small,.hole-stat small{display:block;color:#aeb2ae;font-size:10px;font-weight:500;white-space:nowrap}.hole-main strong{display:block;font-size:20px;line-height:1.15;white-space:nowrap}.hole-stat b{font-size:18px}.gps-pill{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:92px;border:0;border-radius:999px;background:#171917ee;color:#fff;padding:10px 15px;font-size:14px;font-weight:700;box-shadow:0 3px 12px #0006;white-space:nowrap}.hidden{display:none!important}.gps-bottom{position:absolute;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:54px 1fr 54px;gap:10px;align-items:end}.side-button{height:58px;border:0;border-radius:10px;background:#171917ed;color:#fff;font-weight:700;font-size:11px;box-shadow:0 3px 12px #0006}.hole-nav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:58px;border-radius:10px;background:#171917ed;overflow:hidden;box-shadow:0 3px 12px #0007}.hole-nav button{height:58px;border:0;background:transparent;color:#fff;font-size:29px}.hole-nav button:disabled{opacity:.25}.hole-nav .current-hole{height:58px;background:#1687ef;display:grid;place-items:center;text-align:center;font-size:22px;line-height:1;font-weight:800}.current-hole small{display:block;font-size:10px;font-weight:500;margin-top:2px}.setup-card{position:absolute;z-index:4;right:14px;bottom:88px;width:220px;padding:14px;border-radius:14px;background:#171917f2;pointer-events:auto;box-shadow:0 4px 18px #0008}.setup-card p{font-size:12px;color:#d8e2d8}.setup-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.setup-actions button{border:0;border-radius:8px;padding:9px;background:#eee;color:#111;font-weight:700}.setup-actions .active{background:#1687ef;color:#fff}.setup-actions .save{grid-column:1/-1;background:#31a252;color:#fff}.map-note{display:none!important}.course-picker{position:absolute;z-index:5;inset:0;background:#0c120ce8;display:grid;place-items:center;padding:24px;pointer-events:auto}.picker-card{width:min(100%,430px);padding:24px;border-radius:20px;background:#fff;color:#192119}.picker-card input{width:100%;padding:14px;margin-top:8px}.picker-results button{width:100%;padding:12px;border:0;background:#fff;text-align:left}@media(min-width:700px){.gps-top{max-width:650px;margin:auto}.gps-bottom{max-width:440px;margin:auto}}
</style></head>
<body class="gps-page"><div id="courseMap"></div><div class="gps-ui">
<div class="gps-top"><button class="gps-back" id="exitGps">‹</button><div class="hole-card"><div class="hole-number" id="holeNumber">1<small>HOLE</small></div><div class="hole-main"><small>Mid Green</small><strong id="totalYards">—</strong></div><div class="hole-stat"><small>Par</small><b id="holePar">—</b></div><div class="hole-stat"><small id="teeLabel">Yellow</small><b id="teeYards">—</b></div><div class="hole-stat"><small>Handicap</small><b id="holeSI">—</b></div></div><button class="gps-tool" id="rotateLeft">↺</button><button class="gps-tool" id="rotateRight">↻</button><button class="gps-tool" id="openPicker">⌕</button></div>
<div id="targetReadout" class="gps-pill hidden"></div><div id="mapNote" class="map-note"></div>
<div id="setupCard" class="setup-card hidden"><b>Map this hole</b><p>Set the tee and green, then add any hazards.</p><div class="setup-actions"><button data-mode="tee">Set tee</button><button data-mode="green">Set green</button><button data-mode="bunker">Bunker</button><button data-mode="water">Water</button><button id="saveHoleMap" class="save">Save hole</button></div></div>
<div class="gps-bottom"><button id="mapHole" class="side-button">MAP<br>HOLE</button><div class="hole-nav"><button id="previousHole">‹</button><div class="current-hole">Hole <span id="bottomHole">1</span><small>GPS</small></div><button id="nextHole">›</button></div><button id="threeDBtn" class="side-button">3D<br>VIEW</button></div>
<div id="coursePicker" class="course-picker hidden"><div class="picker-card"><button id="closePicker" style="float:right;border:0;background:transparent;font-size:24px">×</button><h2>Choose a venue</h2><input id="courseSearch" placeholder="Start typing"><div id="courseResults" class="picker-results"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="assets/js/supabase-config.js" defer></script><script src="assets/js/supabase-client.js" defer></script><script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBvGmkoNudQv0beSmSma4NPs8gFWo5YsTA&v=weekly&libraries=geometry" defer></script><script src="assets/js/course-view.js?v=gps-pro4" defer></script></body></html>
