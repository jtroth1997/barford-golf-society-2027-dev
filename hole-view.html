<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course View | Barford Golf Society</title>
<link rel="stylesheet" href="assets/css/styles.css?v=ux100">
<style>
#courseMap{height:62vh;min-height:480px;border-radius:20px;overflow:hidden;background:#18301d}
.course-search{position:relative;max-width:680px;margin:22px auto}.course-results{position:absolute;z-index:20;left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 12px 26px #001b1030;overflow:hidden}.course-results button{display:block;width:100%;text-align:left;padding:14px;border:0;border-bottom:1px solid #edf1ee;background:#fff;font:inherit}.course-results button:hover{background:#eff7f1}.course-meta{margin:16px 0;color:#52635a;font-weight:700}
.map-wrap{position:relative}.map-toolbar{position:absolute;z-index:2;right:14px;top:14px;display:flex;gap:8px}.map-toolbar button{border:0;border-radius:999px;padding:11px 14px;background:#172119;color:#fff;font-weight:800;box-shadow:0 3px 12px #0005}.map-toolbar button.active{background:#258a46}.distance-card{position:absolute;z-index:2;left:14px;bottom:18px;max-width:310px;padding:13px 15px;border-radius:14px;background:#172119e8;color:#fff;font-weight:800;box-shadow:0 3px 12px #0005}.distance-card small{display:block;margin-top:4px;color:#d6e3d8;font-weight:600}@media(max-width:600px){#courseMap{height:65vh;min-height:440px}.distance-card{right:14px;bottom:14px;max-width:none}.map-toolbar{top:10px;right:10px}}
</style>
</head>
<body>
<header class="site-header"><div class="shell header-inner"><a class="brand" href="index.html"><img src="assets/images/barford-golf-society-logo.png" alt="Barford Golf Society"></a><nav class="site-nav"><a href="index.html">Home</a><a href="events.html">Events</a><a class="active" href="hole-view.html">Course View</a><a href="scores.html">League Table</a><a href="gallery.html">Photos</a><a href="account.html">My Account</a></nav></div></header>
<main><section class="page-hero"><div class="shell"><p class="eyebrow">Course explorer</p><h1>View a golf course</h1><p>Search for a venue, then tap anywhere on the aerial view to see yardages.</p></div></section>
<section class="section shell"><div class="course-search"><label>Golf venue<input id="courseSearch" autocomplete="off" placeholder="Start typing, e.g. Feldon Valley"></label><div id="courseResults" class="course-results hidden"></div></div><p id="courseStatus" class="course-meta">Search for a venue to begin.</p><div class="map-wrap"><div class="map-toolbar"><button id="topDownBtn" class="active" type="button">Top down</button><button id="threeDBtn" type="button">3D view</button></div><div id="courseDistances" class="distance-card hidden"></div><div id="courseMap"></div></div></section></main>
<script src="assets/js/app.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="assets/js/supabase-config.js" defer></script><script src="assets/js/supabase-client.js" defer></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBvGmkoNudQv0beSmSma4NPs8gFWo5YsTA&v=weekly" defer></script>
<script src="assets/js/course-view.js?v=google1" defer></script>
</body></html>
